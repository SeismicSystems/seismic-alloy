name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      members: read

    steps:
      - name: Check team membership
        id: check-team
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR author is a member of @SeismicSystems/seismic-developers
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ORG="SeismicSystems"
          TEAM="seismic-developers"

          if gh api "orgs/$ORG/teams/$TEAM/memberships/$AUTHOR" --silent 2>/dev/null; then
            echo "is_team_member=true" >> $GITHUB_OUTPUT
            echo "✓ $AUTHOR is a member of @$ORG/$TEAM"
          else
            echo "is_team_member=false" >> $GITHUB_OUTPUT
            echo "✗ $AUTHOR is not a member of @$ORG/$TEAM"
          fi

      - name: Checkout repository
        if: steps.check-team.outputs.is_team_member == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.check-team.outputs.is_team_member == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options


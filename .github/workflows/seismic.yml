name: Seismic CI
on:
  push:
    branches: [seismic]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - name: cargo build
        run: cargo build
  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "warnings-cache"
      - name: cargo check warnings
        run: RUSTFLAGS="-D warnings" cargo check --all-targets
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "unit-test-cache"
      - name: cargo test (unit)
        run: cargo test --workspace --exclude seismic-alloy-provider
  integration-test:
    name: integration-test (${{ matrix.sanvil-channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable compatibility is informational during coordinated breaking releases.
          - sanvil-channel: stable
            allow-failure: true
          # Nightly compatibility is the forward-looking integration gate.
          - sanvil-channel: nightly
            allow-failure: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "integration-test-${{ matrix.sanvil-channel }}-cache"
      # The provider tests start `sanvil`, so install the selected sfoundry release channel and
      # add it to PATH.
      - name: Install sfoundry (${{ matrix.sanvil-channel }})
        run: |
          curl -L https://raw.githubusercontent.com/SeismicSystems/seismic-foundry/seismic/foundryup/install | bash
          SEISMIC_BIN="${XDG_CONFIG_HOME:-$HOME}/.seismic/bin"
          "$SEISMIC_BIN/sfoundryup" --install "${{ matrix.sanvil-channel }}"
          echo "$SEISMIC_BIN" >> $GITHUB_PATH
      - name: cargo test (provider integration against ${{ matrix.sanvil-channel }} sanvil)
        run: cargo test -p seismic-alloy-provider
      - name: run examples
        run: |
          cargo run -p seismic-examples --example basic_contract
          # cargo run -p seismic-examples --example eip-712 # TODO: Fix circular anvil example dependency
          cargo run -p seismic-examples --example security_params
          cargo run -p seismic-examples --example event_subscription
          cargo run -p seismic-examples --example precompiles

name: Seismic CI

on:
  push:
    branches: [ seismic ]
  pull_request:
    branches: [ seismic, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - name: cargo build
        run: cargo build

  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "warnings-cache"
      - name: cargo check warnings
        run: RUSTFLAGS="-D warnings" cargo check

  test:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CARGO_HOME: /home/azureuser/.cargo
      RUSTUP_HOME: /home/azureuser/.rustup
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sanvil via sfoundryup
        run: |
          if ! command -v sanvil &> /dev/null; then
            echo "Installing sanvil via sfoundryup..."
            curl -L \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/SeismicSystems/seismic-foundry/contents/sfoundryup/install" \
              | bash
            source ~/.bashrc || source ~/.bash_profile || true
            sfoundryup
            source ~/.bashrc || source ~/.bash_profile || true
            echo "Installation complete"
          fi
          echo "Verifying sanvil installation..."
          which sanvil
          sanvil --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-cache"
      - name: cargo test
        run: cargo test --workspace
        
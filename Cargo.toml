[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
authors = ["Seismic Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/SeismicSystems/seismic-alloy" 
repository = "https://github.com/SeismicSystems/seismic-alloy"
exclude = ["benches/", "tests/"]

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
# Workspace
seismic-alloy-consensus = { version = "0.0.1", path = "crates/consensus", default-features = false }
seismic-enclave = "0.1.0"

# Alloy
alloy-eips = { version = "0.12", default-features = false }
alloy-serde = { version = "0.12", default-features = false }
alloy-signer = { version = "0.12", default-features = false }
alloy-network = { version = "0.12", default-features = false }
alloy-provider = { version = "0.12", default-features = false }
alloy-transport = { version = "0.12", default-features = false }
alloy-consensus = { version = "0.12", default-features = false }
alloy-rpc-types-eth = { version = "0.12", default-features = false }
alloy-rpc-types-engine = { version = "0.12", default-features = false }
alloy-network-primitives = { version = "0.12", default-features = false }

# Alloy RLP
alloy-rlp = { version = "0.3", default-features = false }

# Alloy Core
alloy-primitives = { version = "0.8.25", default-features = false }
alloy-json-abi = { version = "0.8.25", default-features = false }
alloy-sol-macro-expander = { version = "0.8.25", default-features = false }
alloy-sol-macro-input = { version = "0.8.25", default-features = false }
alloy-sol-types = { version = "0.8.25", default-features = false }
alloy-sol-type-parser = { version = "0.8.25", default-features = false }
alloy-dyn-abi = { version = "0.8.25", default-features = false }

# Serde
serde_repr = "0.1"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_with = "3.11"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Encoding
snap = "1.1.1"
bincode = "1.3.3"
ethereum_ssz = "0.8"


# rpc
jsonrpsee = { version = "0.24", features = [
    "jsonrpsee-core",
    "client-core",
    "server-core",
    "macros",
] }
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"

# misc
cfg-if = "1"
async-trait = "0.1.85"
unsigned-varint = "0.8.0"
spin = { version = "0.9.8", features = ["mutex"] }
lazy_static = { version = "1.5.0", default-features = false }
derive_more = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
similar-asserts = "1.6"

# tracing
tracing-subscriber = "0.3.19"
tracing = { version = "0.1.41", default-features = false }

## misc-testing
arbitrary = { version = "1.4", features = ["derive"] }
arbtest = "0.3"
rand = "0.8"
proptest = "1.6"
proptest-derive = "0.5"
tokio = "1"
rstest = "0.24.0"

## crypto
c-kzg = { version = "1.0", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }


[patch.crates-io]
# alloy-core
alloy-dyn-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-primitives = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-json-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-sol-macro-expander = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-sol-macro-input = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-sol-types = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }
alloy-sol-type-parser = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "fac24f1" }

seismic-enclave = { git = "https://github.com/SeismicSystems/seismic-enclave.git", rev = "06df897"}
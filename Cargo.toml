[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
authors = ["Seismic Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/SeismicSystems/seismic-alloy"
repository = "https://github.com/SeismicSystems/seismic-alloy"
exclude = ["benches/", "tests/"]

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
# Workspace
seismic-alloy-consensus = { version = "0.0.1", path = "crates/consensus", default-features = false }
seismic-alloy-rpc-types = { version = "0.0.1", path = "crates/rpc-types", default-features = false }
seismic-alloy-network = { version = "0.0.1", path = "crates/network", default-features = false }
seismic-alloy-provider = { version = "0.0.1", path = "crates/provider", default-features = false }
seismic-prelude = { version = "0.0.1", path = "crates/prelude" }

seismic-crypto = "0.1.0"

revm = { version = "29.0.0", default-features = false }
seismic-revm = "1.0.0"

# Alloy monorepo (github.com/alloy-rs/alloy) — crates release in lockstep and
# are all pinned to the same version. That includes alloy-json-rpc and
# alloy-tx-macros, which no workspace crate uses directly: the published
# monorepo crates depend on them with caret ranges, so without these pins they
# float to newer releases (alloy-tx-macros generates code for the newer
# TransactionEnvelope trait, which does not compile against 1.1.0).
alloy-consensus = { version = "=1.1.0", default-features = false }
alloy-json-rpc = { version = "=1.1.0", default-features = false }
alloy-tx-macros = { version = "=1.1.0", default-features = false }
alloy-eips = { version = "=1.1.0", default-features = false }
alloy-network = { version = "=1.1.0", default-features = false }
alloy-network-primitives = { version = "=1.1.0", default-features = false }
alloy-node-bindings = { version = "=1.1.0", default-features = false }
alloy-provider = { version = "=1.1.0", features = [
    "reqwest",
    "ws",
    "trace-api",
] }
alloy-pubsub = { version = "=1.1.0", default-features = false }
alloy-rpc-types-eth = { version = "=1.1.0", default-features = false }
alloy-rpc-types-engine = { version = "=1.1.0", default-features = false }
alloy-rpc-client = { version = "=1.1.0", default-features = false }
alloy-rpc-types = { version = "=1.1.0", default-features = false }
alloy-serde = { version = "=1.1.0", default-features = false }
alloy-signer = { version = "=1.1.0", default-features = false }
alloy-signer-local = { version = "=1.1.0", default-features = false }
alloy-contract = { version = "=1.1.0", default-features = false }
alloy-transport = { version = "=1.1.0", default-features = false }
alloy-genesis = { version = "=1.1.0", default-features = false }

# Alloy crates outside the monorepo — each versions independently, so the
# lockstep pin above does not cover them. Exact-pinned: no lockfile is
# committed, and releases inside their caret ranges have bumped their
# alloy-primitives requirement to ^1.6, which conflicts with the patched
# seismic-alloy-core (1.4.1).
alloy-chains = { version = "=0.2.34", default-features = false }
alloy-eip2930 = { version = "=0.2.3", default-features = false }
alloy-eip7702 = { version = "=0.6.3", default-features = false }
alloy-rlp = { version = "0.3.12", default-features = false }

# Alloy Core — patched to the seismic-alloy-core fork (see [patch.crates-io]),
# so the git rev there is what actually gets built.
alloy-primitives = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-json-abi = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-sol-macro-expander = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-sol-macro-input = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-sol-types = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-sol-type-parser = { version = "1.3.1", default-features = false, features = ["seismic"] }
alloy-dyn-abi = { version = "1.3.1", default-features = false, features = ["seismic"] }

# Patched to the seismic-trie fork (see [patch.crates-io]).
alloy-trie = { version = "0.9.1", default-features = false }

# Serde
serde_repr = "0.1"
serde = { version = "1.0.226", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_with = "3.11"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Encoding
snap = "1.1.1"
bincode = "1.3.3"
ethereum_ssz = "0.8"

# rpc
jsonrpsee = { version = "0.24", features = [
    "jsonrpsee-core",
    "client-core",
    "server-core",
    "macros",
] }
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"

# misc
async-trait = "0.1.85"
bytes = { version = "1.5", default-features = false }
cfg-if = "1"
derive_more = { version = "1.0", default-features = false }
futures = "0.3"
futures-util = "0.3"
lazy_static = { version = "1.5.0", default-features = false }
reqwest = { version = "0.12", default-features = false }
spin = { version = "0.9.8", features = ["mutex"] }
similar-asserts = "1.6"
thiserror = { version = "2.0", default-features = false }
unsigned-varint = "0.8.0"

# tracing
tracing-subscriber = "0.3.19"
tracing = { version = "0.1.41", default-features = false }

## misc-testing
arbitrary = { version = "1.4", features = ["derive"] }
arbtest = "0.3"
rand = "0.8"
proptest = "1.6"
proptest-derive = "0.5"
tokio = "1"
rstest = "0.24.0"
secp256k1 = { version = "0.30" }

## crypto
c-kzg = { version = "2.1.1", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[patch.crates-io]
# seismic-crypto
seismic-crypto = { git = "https://github.com/SeismicSystems/enclave.git", rev = "e3df924cd4ce95d54c52bb9b15a7c8f81327a20f" }

# seismic-alloy-core
alloy-dyn-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-primitives = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-json-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-macro-expander = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-macro-input = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-types = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-type-parser = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }

# seismic-trie
alloy-trie = { git = "https://github.com/SeismicSystems/seismic-trie.git", rev = "2787e2265d492fa8eaee00424585b8f7e522178f" }

# revm
revm = { git = "https://github.com/SeismicSystems/seismic-revm.git", rev = "7fc2aee41fc8f9370b7103eb07068b4bdeba9729" }
seismic-revm = { git = "https://github.com/SeismicSystems/seismic-revm.git", rev = "7fc2aee41fc8f9370b7103eb07068b4bdeba9729" }

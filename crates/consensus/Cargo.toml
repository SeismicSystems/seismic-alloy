[package]
name = "seismic-alloy-consensus"
description = "Seismic alloy consensus types"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
seismic-crypto.workspace = true

alloy-eips = { workspace = true, features = ["kzg-sidecar"] }
alloy-primitives = { workspace = true, features = ["rlp", "seismic"] }
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-serde = { workspace = true, optional = true }
alloy-rpc-types-eth = { workspace = true, optional = true }
alloy-dyn-abi = { workspace = true, features = ["eip712", "seismic"]}

# alloy-eip2930, alloy-eip7702, and alloy-tx-macros are unused directly: they
# pin transitive dependencies of alloy-eips and alloy-consensus for this crate
# and every consumer of it (see the workspace manifest for why).
alloy-eip2930.workspace = true
alloy-eip7702.workspace = true
alloy-tx-macros.workspace = true

# k256
k256 = { workspace = true, features = ["ecdsa"]}
secp256k1.workspace = true

# kzg
c-kzg = { workspace = true, features = ["serde"], optional = true }

# arbitrary
arbitrary = { workspace = true, features = ["derive"], optional = true }
rand = { workspace = true }

# serde
serde = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, optional = true }
serde_json.workspace = true
# misc
derive_more = { workspace = true, features = [
    "from",
    "deref",
    "deref_mut",
    "into_iterator",
    "display",
], default-features = false }
anyhow = "1.0"
jsonrpsee = { workspace = true, features = ["client"] }
bytes = { workspace = true, optional = true }
thiserror.workspace = true


[dev-dependencies]
rand.workspace = true
bincode.workspace = true
serde_json.workspace = true
alloy-signer.workspace = true
tokio = { workspace = true, features = ["macros"] }
arbitrary = { workspace = true, features = ["derive"]}
alloy-primitives = { workspace = true, features = ["rlp", "arbitrary", "seismic"] }
alloy-dyn-abi = { workspace = true, features = ["eip712", "arbitrary", "seismic"] }

[features]
default = ["std", "serde"]
std = [
    "alloy-eips/std",
    "alloy-consensus/std",
    "derive_more/std",
]
k256 = ["alloy-primitives/k256", "alloy-consensus/k256"]
kzg = ["alloy-eips/kzg", "alloy-consensus/kzg", "std"]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/rand",
    "alloy-primitives/arbitrary",
    "alloy-dyn-abi/arbitrary",
    "alloy-rpc-types-eth/arbitrary"
]
serde = [
    "dep:serde",
    "dep:alloy-serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
]
serde-bincode-compat = ["serde_with"]

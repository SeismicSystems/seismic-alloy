[package]
name = "seismic-alloy-network"
description = "Seismic blockchain RPC behavior abstraction"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace
seismic-alloy-consensus.workspace = true
seismic-alloy-rpc-types = { workspace = true, features = ["serde"] }

# Alloy
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-network-primitives.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-transport.workspace = true
alloy-serde.workspace = true
alloy-signer.workspace = true
alloy-eip7702.workspace = true

async-trait.workspace = true
derive_more.workspace = true
futures.workspace = true
serde.workspace = true

tracing.workspace = true

[features]
std = [
	"seismic-alloy-consensus/std",
	"seismic-alloy-rpc-types/std"
]
serde = [
	"seismic-alloy-consensus/serde",
	"seismic-alloy-rpc-types/serde"
]
